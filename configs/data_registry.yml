# RAW OBSERVATIONS (use only NetCDF/NC4; ignore .mat/.m files)
observations:
  era5land:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/ERA5/*.nc"
    notes: "ERA5-Land monthly files (1980–2010). Variables: swvl1..swvl4 volumetric m³/m³. Use first three layers for 0–1 m integration."
  gleam42a:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/GLEAM/v4.2a/SMrz/SMrz_*_GLEAM_v4.2a_MO.nc"
    notes: "GLEAM v4.2a SMrz monthly (volumetric). Use v0 (no depth remap)."
  gleam42b:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/GLEAM/v4.2b/SMrz/SMrz_*_GLEAM_v4.2b_MO.nc"
    notes: "GLEAM v4.2b SMrz monthly (volumetric). Use v0 (no depth remap)."
  gldas_v20:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/GLDASv2/v2.0/GLDAS_NOAH025_M.A*.020.nc4"
    notes: "GLDAS-2.0 NOAH025 monthly 0.25° (1948–2014). Variables: SoilMoi* volumetric m³/m³; integrate 0–10, 10–40, and 40–100 cm to approximate 0–1 m (v0)."
  gldas_v21:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/GLDASv2/v2.1/GLDAS_NOAH025_M.A*.021.nc4"
    notes: "GLDAS-2.1 NOAH025 monthly 0.25° (2000–2020). Same layer mapping as v2.0 (v0)."
  somo_ml_layer1:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/SOMO-ML/SoMo.ml_v1_layer1/SoMo.ml_v1_layer1_*.nc"
    notes: "SoMo.ml v1 Layer 1 (0–10 cm), volumetric (m^3 m^-3). Annual NetCDF per year; will be aggregated to monthly and regridded to 0.5°."
  somo_ml_layer2:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/SOMO-ML/SoMo.ml_v1_layer2/SoMo.ml_v1_layer2_*.nc"
    notes: "SoMo.ml v1 Layer 2 (10–30 cm), volumetric (m^3 m^-3). Annual NetCDF per year; will be aggregated to monthly and regridded to 0.5°."
  somo_ml_layer3:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/SOMO-ML/SoMo.ml_v1_layer3/SoMo.ml_v1_layer3_*.nc"
    notes: "SoMo.ml v1 Layer 3 (30–50 cm), volumetric (m^3 m^-3). Annual NetCDF per year; will be aggregated to monthly and regridded to 0.5°."
  gracedadm_weekly:
    path: "/Users/thchilly/projects/sm_attribution/data/observed/GRACEDADM/raw_weekly_files/GRACEDADM_CLSM025GL_7D.A*.030.nc4"
    notes: "GRACE-DA-DM Global v3.0 weekly percentiles (sfsm_inst, rtzsm_inst, gws_inst), 0.25°. Aggregate to monthly and coarsen to 0.5°. Use rtzsm_inst for root-zone."
  # grace-da-dm: add later

